[package]
name = "nerka-gui"
description = "Nerka desktop log viewer (egui)"
version.workspace = true
# Not on crates.io (yet): released as archives (.github/workflows/release.yml).
publish = false
edition.workspace = true
# egui / eframe 0.37 need Rust 1.95; core and the CLI build on 1.88.
rust-version = "1.95"
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nerka-gui"
path = "src/main.rs"

[dependencies]
nerka-core.workspace = true
eframe.workspace = true
rfd.workspace = true
# PNG for `--screenshot` (ui/src/shot.rs); already built for core (MF4).
miniz_oxide.workspace = true

# Embeds the icon in the .exe (build.rs); Windows only.
[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
