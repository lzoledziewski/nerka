# Release builds for Linux and Windows.
#
# Push a tag like v0.1.0 to build both and publish them as a GitHub
# release (a tag with a '-' suffix, like v0.1.0-alpha.1, is a pre-release).
# Run it by hand (Actions tab, "Run workflow") to only build: the archives
# are kept as workflow artifacts, nothing is published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only token by default; only the publish job writes (the release).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the binaries run on older distributions too (glibc 2.35).
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      # --locked: build exactly the dependencies in Cargo.lock.
      - name: Test
        run: cargo test --workspace --release --locked
      - name: Build
        run: cargo build --release --workspace --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          dir="nerka-${ref}-${{ matrix.name }}"
          mkdir "$dir"
          cp target/release/nerka target/release/nerka-gui README.md LICENSE-MIT LICENSE-APACHE "$dir/"
          cp -r licenses "$dir/"
          tar czf "$dir.tar.gz" "$dir"
          echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF_NAME -replace '/', '-'
          $dir = "nerka-$ref-${{ matrix.name }}"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/nerka.exe, target/release/nerka-gui.exe, README.md, LICENSE-MIT, LICENSE-APACHE $dir
          Copy-Item -Recurse licenses $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          "ASSET=$dir.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    # A pre-release for a tag with a `-` (v0.1.0-alpha.1), else a release.
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Checksums of the archives, published with them: `sha256sum -c SHA256SUMS`.
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
