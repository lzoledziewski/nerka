# Checks on every push to main and every pull request: format, clippy,
# tests, dependency licences / advisories (cargo deny), DCO sign-offs.
# Builds and tests on Linux and Windows; macOS isn't built yet (doc/status.md,
# "CI and releases").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # Licences, security advisories and banned or duplicate crates (deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Every commit of a pull request carries a DCO sign-off by its author
  # (CONTRIBUTING.md). The maintainer's own commits are exempt: they hold
  # the copyright (doc/status.md, "Licensing").
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAINTAINER: l.zoledziewski@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git log -1 --format='%ae' "$c")"
            [ "$email" = "$MAINTAINER" ] && continue
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -F "Signed-off-by: $author" > /dev/null; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author' line (commit with -s, see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit $fail
