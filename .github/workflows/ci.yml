# Checks on every push to main and every pull request: format, clippy,
# tests, dependency licences / advisories (cargo deny), DCO sign-offs.
# Builds and tests on Linux and Windows; macOS too, non-voting (docs/dev/status.md,
# "CI and releases").
# Actions are pinned by commit, the release as a comment (review 2026-11-07
# R16): to update one, `gh api repos/OWNER/ACTION/commits/TAG --jq .sha`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # macOS is built and tested but doesn't fail the run yet (owner,
    # 2026-11-14: non-voting until it has been green for a while).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev \
            xvfb libxkbcommon-x11-0 mesa-vulkan-drivers libvulkan1 libegl1 libgl1-mesa-dri
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The GUI started for real: a small generated DLT with its FIBEX, three
      # signals plotted, the window saved as a PNG by the app itself
      # (`--screenshot`) and kept as an artifact to look at. Linux renders in
      # a virtual X display with Mesa's software Vulkan, Windows with WARP.
      # Built after the tests, so the dependencies are compiled once.
      - name: Build the GUI
        run: cargo build --locked -p nerka-gui --bin nerka-gui -p nerka-core --example gen_fibex_dlt
      - name: Test data
        shell: bash
        run: target/debug/examples/gen_fibex_dlt shot.dlt shot.xml 5 40
      - name: Screenshot
        shell: bash
        timeout-minutes: 10
        env:
          SHOT: nerka-${{ matrix.os }}.png
        run: |
          args=(shot.dlt --fibex shot.xml --plot m0_speed --plot m1_temp --plot m2_voltage --screenshot "$SHOT")
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" target/debug/nerka-gui "${args[@]}"
          else
            target/debug/nerka-gui "${args[@]}"
          fi
          test -s "$SHOT" && ls -l "$SHOT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshot-${{ matrix.os }}
          path: nerka-${{ matrix.os }}.png
          if-no-files-found: ignore

  # Licences, security advisories and banned or duplicate crates (deny.toml).
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Every commit of a pull request carries a DCO sign-off by its author
  # (CONTRIBUTING.md). The maintainer's own commits are exempt: they hold
  # the copyright (docs/dev/status.md, "Licensing").
  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      MAINTAINER: l.zoledziewski@gmail.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email="$(git log -1 --format='%ae' "$c")"
            [ "$email" = "$MAINTAINER" ] && continue
            author="$(git log -1 --format='%an <%ae>' "$c")"
            if ! git log -1 --format='%B' "$c" | grep -F "Signed-off-by: $author" > /dev/null; then
              echo "::error::$(git log -1 --format='%h %s' "$c"): no 'Signed-off-by: $author' line (commit with -s, see CONTRIBUTING.md)"
              fail=1
            fi
          done
          exit $fail
