name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please don't attach real logs or captures that may contain private data.
        A security problem (a file that crashes or hangs nerka)? Report it privately instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps, the query you ran, and if possible a small synthetic file that shows it.
  - type: input
    id: version
    attributes:
      label: nerka version
      placeholder: "nerka --version, or the About dialog (F1) in the GUI"
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part
      options: [GUI, CLI, both]
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "Windows 11, Ubuntu 24.04, … (and the graphics card for GUI problems)"
  - type: dropdown
    id: format
    attributes:
      label: File format
      options: [plain text, DLT, pcap / pcapng, MF4, several files, not file-related]
