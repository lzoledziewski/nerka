name: Feature request
description: An idea for nerka
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with your logs, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Mockups or example queries are welcome.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: File formats, file sizes, other tools you use for this.
